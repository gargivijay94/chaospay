version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: chaospay-postgres
    environment:
      POSTGRES_DB: chaospay
      POSTGRES_USER: chaospay
      POSTGRES_PASSWORD: chaospay
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chaospay-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: