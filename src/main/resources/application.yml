server:
  port: 8080

spring:
  application:
    name: chaospay
  datasource:
    url: jdbc:postgresql://localhost:5432/chaospay?options=-c%20TimeZone=UTC
    username: chaospay
    password: chaospay
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers,retries

resilience4j:
  circuitbreaker:
    instances:
      processor:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  retry:
    instances:
      processor:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.chaospay.exception.ProcessorException

logging:
  level:
    com.chaospay: DEBUG
